<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meseros — MenuJPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237D2E3F'/%3E%3Ctext x='32' y='43' font-family='Georgia, serif' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EMJ%3C/text%3E%3C/svg%3E">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/shell-app :: shell(activo='meseros')}"></div>

<main class="page-content">
    <header class="page-header">
        <div>
            <h1 class="page-title">Meseros</h1>
            <p class="page-subtitle">Personal de sala que toma y entrega los pedidos</p>
        </div>
        <button class="btn btn-primary" data-rol="GERENTE" onclick="abrirModal()">
            <i class="bi bi-plus"></i> Nuevo Mesero
        </button>
    </header>

    <div class="table-wrapper">
        <div class="table-header">
            <span class="table-title">Personal registrado</span>
        </div>
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Apellido, Nombre</th>
                        <th>Cédula</th>
                        <th>Salario</th>
                        <th>Horario</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="bodyMeseros">
                    <tr><td colspan="6" style="padding: 0"><div class="empty-state"><div class="spinner"></div></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal Mesero -->
<div class="modal-overlay" id="modalMeseroOverlay">
    <div class="modal modal-lg">
        <div class="modal-header">
            <h3 class="modal-title" id="modalTitulo">Mesero</h3>
            <button class="modal-close" onclick="modalHide('modalMeseroOverlay')"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="meseroId">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Nombre <span class="required">*</span></label>
                    <input type="text" class="form-input" id="nombre" maxlength="100">
                </div>
                <div class="form-group">
                    <label class="form-label">Apellido <span class="required">*</span></label>
                    <input type="text" class="form-input" id="apellido" maxlength="100">
                </div>
                <div class="form-group">
                    <label class="form-label">Cédula / DNI</label>
                    <input type="text" class="form-input" id="cedula" maxlength="20">
                </div>
                <div class="form-group">
                    <label class="form-label">Teléfono</label>
                    <input type="text" class="form-input" id="telefono" maxlength="20">
                </div>
                <div class="form-group">
                    <label class="form-label">Correo</label>
                    <input type="email" class="form-input" id="correo" maxlength="100">
                </div>
                <div class="form-group">
                    <label class="form-label">Salario ($)</label>
                    <input type="number" class="form-input" id="salario" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Fecha de Vinculación</label>
                    <input type="date" class="form-input" id="fechaVinculacion">
                </div>
                <div class="form-group">
                    <label class="form-label">Usuario (login)</label>
                    <input type="text" class="form-input" id="usuario" maxlength="100" placeholder="Usuario para iniciar sesión">
                </div>
                <div class="form-group" id="grupoContrasenia">
                    <label class="form-label">Contraseña <span class="required">*</span></label>
                    <input type="password" class="form-input" id="contrasenia" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="modalHide('modalMeseroOverlay')">Cancelar</button>
            <button class="btn btn-primary" onclick="guardarMesero()">
                <i class="bi bi-check-lg"></i> Guardar
            </button>
        </div>
    </div>
</div>

<!-- Modal Confirmar Eliminar -->
<div class="modal-overlay" id="modalEliminarOverlay">
    <div class="modal modal-sm">
        <div class="modal-header">
            <h3 class="modal-title">Confirmar eliminación</h3>
            <button class="modal-close" onclick="modalHide('modalEliminarOverlay')"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <p class="confirm-text">¿Eliminar este mesero? La acción no se puede deshacer.</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="modalHide('modalEliminarOverlay')">Cancelar</button>
            <button class="btn btn-danger" id="btnConfirmarEliminar">
                <i class="bi bi-trash"></i> Eliminar
            </button>
        </div>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script>
Auth.requireRoles('GERENTE');

const API = '/api/v1/meseros';

async function cargarMeseros() {
    const data = await cargarConEstado(
        () => apiFetch(API),
        'bodyMeseros', 6,
        'bi-person-vcard', 'No hay meseros registrados'
    );
    if (!data || data.length === 0) return;

    document.getElementById('bodyMeseros').innerHTML = data.map(m => `
        <tr>
            <td><span class="badge badge-default">${m.id}</span></td>
            <td><strong>${escapeHtml(m.apellido || '—')}</strong>${m.nombre ? ', ' + escapeHtml(m.nombre) : ''}</td>
            <td>${escapeHtml(m.cedula || '—')}</td>
            <td>${m.salario != null ? '$ ' + Number(m.salario).toLocaleString('es-AR') : '—'}</td>
            <td>
                ${m.horaIngreso ? `<span class="badge badge-default">${m.horaIngreso}</span>` : ''}
                ${m.horaSalida  ? `<span class="badge badge-default">${m.horaSalida}</span>` : ''}
                ${!m.horaIngreso && !m.horaSalida ? '—' : ''}
            </td>
            <td>
                <div class="td-actions">
                    <button class="btn btn-ghost btn-sm" onclick="editarMesero(${m.id})" title="Editar"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-danger btn-sm" onclick="confirmarEliminar(${m.id})" title="Eliminar"><i class="bi bi-trash"></i></button>
                </div>
            </td>
        </tr>
    `).join('');
}

const CAMPOS = ['meseroId','nombre','apellido','cedula','telefono','correo','salario','fechaVinculacion','usuario','contrasenia'];
function limpiarModal() { CAMPOS.forEach(id => { document.getElementById(id).value = ''; }); }

function abrirModal() {
    limpiarModal();
    document.getElementById('grupoContrasenia').style.display = '';
    document.getElementById('modalTitulo').textContent = 'Nuevo Mesero';
    modalShow('modalMeseroOverlay');
}

async function editarMesero(id) {
    const m = await apiFetch(`${API}/${id}`);
    if (!m) return;
    limpiarModal();
    document.getElementById('meseroId').value          = m.id;
    document.getElementById('nombre').value            = m.nombre || '';
    document.getElementById('apellido').value          = m.apellido || '';
    document.getElementById('cedula').value             = m.cedula || '';
    document.getElementById('telefono').value           = m.telefono || '';
    document.getElementById('correo').value             = m.correo || '';
    document.getElementById('salario').value            = m.salario || '';
    document.getElementById('fechaVinculacion').value   = m.fechaVinculacion ? m.fechaVinculacion.split('T')[0] : '';
    document.getElementById('usuario').value            = m.usuario || '';
    document.getElementById('grupoContrasenia').style.display = 'none';
    document.getElementById('modalTitulo').textContent  = 'Editar Mesero';
    modalShow('modalMeseroOverlay');
}

async function guardarMesero() {
    const nombre       = document.getElementById('nombre').value.trim();
    const apellido     = document.getElementById('apellido').value.trim();
    const correo       = document.getElementById('correo').value.trim();
    const salario      = document.getElementById('salario').value;
    const id           = document.getElementById('meseroId').value;
    const contrasenia  = document.getElementById('contrasenia').value;

    if (!Validar.requerido(nombre,   'Nombre'))   return;
    if (!Validar.requerido(apellido, 'Apellido')) return;
    if (!Validar.email(correo))                   return;
    if (!Validar.numPositivo(salario, 'Salario')) return;
    if (!id && contrasenia.length < 8) { mostrarAlerta('La contraseña debe tener al menos 8 caracteres.', 'warning'); return; }

    const body = {
        nombre, apellido,
        cedula:           document.getElementById('cedula').value.trim() || null,
        telefono:         document.getElementById('telefono').value.trim() || null,
        correo:           correo || null,
        salario:          salario ? parseFloat(salario) : null,
        fechaVinculacion: document.getElementById('fechaVinculacion').value || null,
        usuario:          document.getElementById('usuario').value.trim() || null
    };
    if (id) body.id = parseInt(id);
    else body.contrasenia = contrasenia;

    const result = await apiFetch(id ? `${API}/${id}` : API, id ? 'PUT' : 'POST', body);
    if (result) {
        modalHide('modalMeseroOverlay');
        mostrarAlerta(id ? 'Mesero actualizado correctamente.' : 'Mesero creado correctamente.', 'success');
        cargarMeseros();
    }
}

function confirmarEliminar(id) {
    document.getElementById('btnConfirmarEliminar').onclick = async () => {
        const ok = await apiFetch(`${API}/${id}`, 'DELETE');
        if (ok) {
            modalHide('modalEliminarOverlay');
            mostrarAlerta('Mesero eliminado correctamente.', 'success');
            cargarMeseros();
        }
    };
    modalShow('modalEliminarOverlay');
}

cargarMeseros();
</script>
</body>
</html>
