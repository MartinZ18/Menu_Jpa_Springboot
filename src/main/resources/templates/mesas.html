<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas — MenuJPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237D2E3F'/%3E%3Ctext x='32' y='43' font-family='Georgia, serif' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EMJ%3C/text%3E%3C/svg%3E">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/shell-app :: shell(activo='mesas')}"></div>

<main class="page-content">
    <header class="page-header">
        <div>
            <h1 class="page-title">Mesas</h1>
            <p class="page-subtitle">Mesas del salón: número y capacidad</p>
        </div>
        <button class="btn btn-primary" data-rol="GERENTE" onclick="abrirModal()"><i class="bi bi-plus"></i> Nueva Mesa</button>
    </header>

    <div class="table-wrapper">
        <div class="table-header"><span class="table-title">Mesas registradas</span></div>
        <div class="table-responsive">
            <table class="data-table">
                <thead><tr><th>#</th><th>Número</th><th>Capacidad</th><th></th></tr></thead>
                <tbody id="bodyMesas">
                    <tr><td colspan="4" style="padding:0"><div class="empty-state"><div class="spinner"></div></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div class="modal-overlay" id="modalMesaOverlay">
    <div class="modal modal-md">
        <div class="modal-header">
            <h3 class="modal-title" id="modalTitulo">Mesa</h3>
            <button class="modal-close" onclick="modalHide('modalMesaOverlay')"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="mesaId">
            <div class="form-group">
                <label class="form-label">Número <span class="required">*</span></label>
                <input type="number" class="form-input" id="numero" min="1" step="1">
            </div>
            <div class="form-group">
                <label class="form-label">Capacidad (personas) <span class="required">*</span></label>
                <input type="number" class="form-input" id="capacidad" min="1" step="1">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="modalHide('modalMesaOverlay')">Cancelar</button>
            <button class="btn btn-primary" onclick="guardarMesa()"><i class="bi bi-check-lg"></i> Guardar</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalEliminarOverlay">
    <div class="modal modal-sm">
        <div class="modal-header">
            <h3 class="modal-title">Confirmar eliminación</h3>
            <button class="modal-close" onclick="modalHide('modalEliminarOverlay')"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body"><p class="confirm-text">¿Eliminar esta mesa? Falla si tiene reservas activas.</p></div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="modalHide('modalEliminarOverlay')">Cancelar</button>
            <button class="btn btn-danger" id="btnConfirmarEliminar"><i class="bi bi-trash"></i> Eliminar</button>
        </div>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script>
Auth.requireRoles('GERENTE', 'MESERO');

const API = '/api/v1/mesas';

async function cargarMesas() {
    const data = await cargarConEstado(() => apiFetch(API), 'bodyMesas', 4, 'bi-grid-3x3-gap', 'No hay mesas registradas');
    if (!data || data.length === 0) return;

    document.getElementById('bodyMesas').innerHTML = data.map(m => `
        <tr>
            <td><span class="badge badge-default">${m.id}</span></td>
            <td><strong>Mesa ${m.numero}</strong></td>
            <td>${m.capacidad} personas</td>
            <td>
                <div class="td-actions">
                    <button class="btn btn-ghost btn-sm" onclick="editarMesa(${m.id})" title="Editar"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-danger btn-sm" onclick="confirmarEliminar(${m.id})" title="Eliminar"><i class="bi bi-trash"></i></button>
                </div>
            </td>
        </tr>
    `).join('');
}

function abrirModal() {
    document.getElementById('mesaId').value = '';
    document.getElementById('numero').value = '';
    document.getElementById('capacidad').value = '';
    document.getElementById('modalTitulo').textContent = 'Nueva Mesa';
    modalShow('modalMesaOverlay');
}

async function editarMesa(id) {
    const m = await apiFetch(`${API}/${id}`);
    if (!m) return;
    document.getElementById('mesaId').value = m.id;
    document.getElementById('numero').value = m.numero;
    document.getElementById('capacidad').value = m.capacidad;
    document.getElementById('modalTitulo').textContent = 'Editar Mesa';
    modalShow('modalMesaOverlay');
}

async function guardarMesa() {
    const numero    = document.getElementById('numero').value;
    const capacidad = document.getElementById('capacidad').value;
    if (!Validar.requerido(numero, 'Número')) return;
    if (!Validar.requerido(capacidad, 'Capacidad')) return;

    const id   = document.getElementById('mesaId').value;
    const body = { numero: parseInt(numero), capacidad: parseInt(capacidad) };
    if (id) body.id = parseInt(id);

    const result = await apiFetch(id ? `${API}/${id}` : API, id ? 'PUT' : 'POST', body);
    if (result) {
        modalHide('modalMesaOverlay');
        mostrarAlerta(id ? 'Mesa actualizada.' : 'Mesa creada.', 'success');
        cargarMesas();
    }
}

function confirmarEliminar(id) {
    document.getElementById('btnConfirmarEliminar').onclick = async () => {
        const ok = await apiFetch(`${API}/${id}`, 'DELETE');
        if (ok) {
            modalHide('modalEliminarOverlay');
            mostrarAlerta('Mesa eliminada.', 'success');
            cargarMesas();
        }
    };
    modalShow('modalEliminarOverlay');
}

cargarMesas();
</script>
</body>
</html>
