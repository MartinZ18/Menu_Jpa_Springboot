<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredientes — MenuJPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237D2E3F'/%3E%3Ctext x='32' y='43' font-family='Georgia, serif' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EMJ%3C/text%3E%3C/svg%3E">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/shell-app :: shell(activo='ingredientes')}"></div>

<main class="page-content">
    <header class="page-header">
        <div>
            <h1 class="page-title">Ingredientes</h1>
            <p class="page-subtitle">Catálogo de ingredientes y su stock</p>
        </div>
        <button class="btn btn-primary" data-rol="GERENTE" onclick="abrirModal()"><i class="bi bi-plus"></i> Nuevo Ingrediente</button>
    </header>

    <div class="table-wrapper">
        <div class="table-header"><span class="table-title">Ingredientes registrados</span></div>
        <div class="table-responsive">
            <table class="data-table">
                <thead><tr><th>#</th><th>Descripción</th><th>Stock</th><th></th></tr></thead>
                <tbody id="bodyIngredientes">
                    <tr><td colspan="4" style="padding:0"><div class="empty-state"><div class="spinner"></div></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div class="modal-overlay" id="modalIngredienteOverlay">
    <div class="modal modal-md">
        <div class="modal-header">
            <h3 class="modal-title" id="modalTitulo">Ingrediente</h3>
            <button class="modal-close" onclick="modalHide('modalIngredienteOverlay')"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="ingredienteId">
            <div class="form-group">
                <label class="form-label">Descripción <span class="required">*</span></label>
                <input type="text" class="form-input" id="descripcion" maxlength="200" placeholder="Ej: Harina 000">
            </div>
            <div class="form-group">
                <label class="form-label">Cantidad en stock</label>
                <input type="number" class="form-input" id="cantidadStock" min="0" step="1" placeholder="0">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="modalHide('modalIngredienteOverlay')">Cancelar</button>
            <button class="btn btn-primary" onclick="guardarIngrediente()"><i class="bi bi-check-lg"></i> Guardar</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalEliminarOverlay">
    <div class="modal modal-sm">
        <div class="modal-header">
            <h3 class="modal-title">Confirmar eliminación</h3>
            <button class="modal-close" onclick="modalHide('modalEliminarOverlay')"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body"><p class="confirm-text">¿Eliminar este ingrediente? Falla si está en alguna despensa.</p></div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="modalHide('modalEliminarOverlay')">Cancelar</button>
            <button class="btn btn-danger" id="btnConfirmarEliminar"><i class="bi bi-trash"></i> Eliminar</button>
        </div>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script>
Auth.requireRoles('GERENTE');

const API = '/api/v1/ingredientes';

async function cargarIngredientes() {
    const data = await cargarConEstado(() => apiFetch(API), 'bodyIngredientes', 4, 'bi-egg-fried', 'No hay ingredientes registrados');
    if (!data || data.length === 0) return;

    document.getElementById('bodyIngredientes').innerHTML = data.map(i => `
        <tr>
            <td><span class="badge badge-default">${i.id}</span></td>
            <td>${escapeHtml(i.descripcion)}</td>
            <td>${i.cantidadStock != null ? i.cantidadStock : 0}</td>
            <td>
                <div class="td-actions">
                    <button class="btn btn-ghost btn-sm" onclick="editarIngrediente(${i.id})" title="Editar"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-danger btn-sm" onclick="confirmarEliminar(${i.id})" title="Eliminar"><i class="bi bi-trash"></i></button>
                </div>
            </td>
        </tr>
    `).join('');
}

function abrirModal() {
    document.getElementById('ingredienteId').value = '';
    document.getElementById('descripcion').value = '';
    document.getElementById('cantidadStock').value = '';
    document.getElementById('modalTitulo').textContent = 'Nuevo Ingrediente';
    modalShow('modalIngredienteOverlay');
}

async function editarIngrediente(id) {
    const i = await apiFetch(`${API}/${id}`);
    if (!i) return;
    document.getElementById('ingredienteId').value = i.id;
    document.getElementById('descripcion').value = i.descripcion || '';
    document.getElementById('cantidadStock').value = i.cantidadStock != null ? i.cantidadStock : '';
    document.getElementById('modalTitulo').textContent = 'Editar Ingrediente';
    modalShow('modalIngredienteOverlay');
}

async function guardarIngrediente() {
    const descripcion = document.getElementById('descripcion').value.trim();
    if (!Validar.requerido(descripcion, 'Descripción')) return;

    const id   = document.getElementById('ingredienteId').value;
    const stock = document.getElementById('cantidadStock').value;
    const body = { descripcion, cantidadStock: stock !== '' ? parseInt(stock) : 0 };
    if (id) body.id = parseInt(id);

    const result = await apiFetch(id ? `${API}/${id}` : API, id ? 'PUT' : 'POST', body);
    if (result) {
        modalHide('modalIngredienteOverlay');
        mostrarAlerta(id ? 'Ingrediente actualizado.' : 'Ingrediente creado.', 'success');
        cargarIngredientes();
    }
}

function confirmarEliminar(id) {
    document.getElementById('btnConfirmarEliminar').onclick = async () => {
        const ok = await apiFetch(`${API}/${id}`, 'DELETE');
        if (ok) {
            modalHide('modalEliminarOverlay');
            mostrarAlerta('Ingrediente eliminado.', 'success');
            cargarIngredientes();
        }
    };
    modalShow('modalEliminarOverlay');
}

cargarIngredientes();
</script>
</body>
</html>
