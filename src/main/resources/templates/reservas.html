<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas — MenuJPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237D2E3F'/%3E%3Ctext x='32' y='43' font-family='Georgia, serif' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EMJ%3C/text%3E%3C/svg%3E">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/shell-app :: shell(activo='reservas')}"></div>

<main class="page-content">
    <header class="page-header">
        <div>
            <h1 class="page-title">Reservas</h1>
            <p class="page-subtitle" id="pageSubtitle">Reserva de mesas</p>
        </div>
        <button class="btn btn-primary" data-rol="CLIENTE" onclick="abrirModalReservar()"><i class="bi bi-plus"></i> Reservar Mesa</button>
    </header>

    <div class="table-wrapper">
        <div class="table-header"><span class="table-title">Reservas</span></div>
        <div class="table-responsive">
            <table class="data-table">
                <thead><tr><th>#</th><th>Cliente</th><th>Mesa</th><th>Fecha</th><th>Horario</th><th>Personas</th><th>Estado</th><th></th></tr></thead>
                <tbody id="bodyReservas">
                    <tr><td colspan="8" style="padding:0"><div class="empty-state"><div class="spinner"></div></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal Reservar -->
<div class="modal-overlay" id="modalReservaOverlay">
    <div class="modal modal-md">
        <div class="modal-header">
            <h3 class="modal-title">Reservar Mesa</h3>
            <button class="modal-close" onclick="modalHide('modalReservaOverlay')"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Mesa <span class="required">*</span></label>
                <select class="form-input" id="reservaMesa"><option value="">Seleccionar…</option></select>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Fecha <span class="required">*</span></label>
                    <input type="date" class="form-input" id="reservaFecha">
                </div>
                <div class="form-group">
                    <label class="form-label">Personas <span class="required">*</span></label>
                    <input type="number" class="form-input" id="reservaPersonas" min="1" step="1">
                </div>
                <div class="form-group">
                    <label class="form-label">Hora de inicio <span class="required">*</span></label>
                    <input type="time" class="form-input" id="reservaHoraInicio">
                </div>
                <div class="form-group">
                    <label class="form-label">Hora de fin <span class="required">*</span></label>
                    <input type="time" class="form-input" id="reservaHoraFin">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="modalHide('modalReservaOverlay')">Cancelar</button>
            <button class="btn btn-primary" onclick="reservarMesa()"><i class="bi bi-check-lg"></i> Reservar</button>
        </div>
    </div>
</div>

<!-- Modal Confirmar Cancelar -->
<div class="modal-overlay" id="modalCancelarOverlay">
    <div class="modal modal-sm">
        <div class="modal-header">
            <h3 class="modal-title">Cancelar reserva</h3>
            <button class="modal-close" onclick="modalHide('modalCancelarOverlay')"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body"><p class="confirm-text">¿Cancelar esta reserva?</p></div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="modalHide('modalCancelarOverlay')">Volver</button>
            <button class="btn btn-danger" id="btnConfirmarCancelar"><i class="bi bi-x-circle"></i> Cancelar reserva</button>
        </div>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script>
Auth.requireRoles('GERENTE', 'MESERO', 'CLIENTE');

const API = '/api/v1/reservas';

document.getElementById('pageSubtitle').textContent = Auth.tieneRol('CLIENTE')
    ? 'Tus reservas de mesa'
    : 'Reservas de todos los clientes';

async function cargarReservas() {
    const data = await cargarConEstado(() => apiFetch(API), 'bodyReservas', 8, 'bi-calendar-check', 'No hay reservas');
    if (!data || data.length === 0) return;

    document.getElementById('bodyReservas').innerHTML = data.map(r => {
        const activa = r.estado === 'ACTIVA';
        const estadoBadge = activa
            ? '<span class="badge badge-activa">Activa</span>'
            : '<span class="badge badge-cancelada">Cancelada</span>';
        const accion = activa
            ? `<button class="btn btn-danger btn-sm" onclick="confirmarCancelar(${r.id})" title="Cancelar"><i class="bi bi-x-circle"></i></button>`
            : '';
        return `<tr>
            <td><span class="badge badge-default">${r.id}</span></td>
            <td>${escapeHtml(r.cliente.apellido + ', ' + r.cliente.nombre)}</td>
            <td>Mesa ${r.mesa.numero}</td>
            <td>${formatFecha(r.fecha)}</td>
            <td>${r.horaInicio} – ${r.horaFin}</td>
            <td>${r.cantidadPersonas}</td>
            <td>${estadoBadge}</td>
            <td><div class="td-actions">${accion}</div></td>
        </tr>`;
    }).join('');
}

async function abrirModalReservar() {
    const mesas = await apiFetch('/api/v1/mesas') || [];
    const sel = document.getElementById('reservaMesa');
    sel.innerHTML = '<option value="">Seleccionar…</option>' +
        mesas.map(m => `<option value="${m.id}">Mesa ${m.numero} (${m.capacidad} personas)</option>`).join('');
    document.getElementById('reservaFecha').value = '';
    document.getElementById('reservaPersonas').value = '';
    document.getElementById('reservaHoraInicio').value = '';
    document.getElementById('reservaHoraFin').value = '';
    modalShow('modalReservaOverlay');
}

async function reservarMesa() {
    const mesaId    = document.getElementById('reservaMesa').value;
    const fecha     = document.getElementById('reservaFecha').value;
    const personas  = document.getElementById('reservaPersonas').value;
    const horaInicio = document.getElementById('reservaHoraInicio').value;
    const horaFin    = document.getElementById('reservaHoraFin').value;

    if (!Validar.requerido(mesaId, 'Mesa')) return;
    if (!Validar.requerido(fecha, 'Fecha')) return;
    if (!Validar.requerido(personas, 'Cantidad de personas')) return;
    if (!Validar.requerido(horaInicio, 'Hora de inicio')) return;
    if (!Validar.requerido(horaFin, 'Hora de fin')) return;

    const body = {
        mesaId: parseInt(mesaId), fecha,
        horaInicio, horaFin,
        cantidadPersonas: parseInt(personas)
    };
    const result = await apiFetch(`${API}/reservar`, 'POST', body);
    if (result) {
        modalHide('modalReservaOverlay');
        mostrarAlerta('Mesa reservada.', 'success');
        cargarReservas();
    }
}

function confirmarCancelar(id) {
    document.getElementById('btnConfirmarCancelar').onclick = async () => {
        const ok = await apiFetch(`${API}/${id}/cancelar`, 'POST');
        if (ok !== null) {
            modalHide('modalCancelarOverlay');
            mostrarAlerta('Reserva cancelada.', 'success');
            cargarReservas();
        }
    };
    modalShow('modalCancelarOverlay');
}

cargarReservas();
</script>
</body>
</html>
