<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — MenuJPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237D2E3F'/%3E%3Ctext x='32' y='43' font-family='Georgia, serif' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EMJ%3C/text%3E%3C/svg%3E">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="nav-logo-mark" style="background: var(--accent)">MJ</div>
        </div>
        <h1 class="auth-title">Iniciar sesión</h1>
        <p class="auth-subtitle">Cliente, Chef, Mesero o Gerente</p>

        <div class="form-group">
            <label class="form-label">Usuario</label>
            <input type="text" class="form-input" id="usuario" placeholder="usuario" autocomplete="username">
        </div>
        <div class="form-group">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-input" id="contrasenia" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" style="width:100%; justify-content:center" onclick="login()">
            <i class="bi bi-box-arrow-in-right"></i> Entrar
        </button>

        <p class="auth-footer">¿No tenés cuenta? <a href="/registro">Registrate como cliente</a></p>
        <p class="auth-footer"><a href="/"><i class="bi bi-arrow-left"></i> Volver al inicio</a></p>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script>
async function login() {
    const usuario = document.getElementById('usuario').value.trim();
    const contrasenia = document.getElementById('contrasenia').value;
    if (!Validar.requerido(usuario, 'Usuario')) return;
    if (!Validar.requerido(contrasenia, 'Contraseña')) return;

    const result = await apiFetch('/api/v1/auth/login', 'POST', { usuario, contrasenia });
    if (result) {
        Auth.guardarSesion(result.token, result.rol, usuario);
        mostrarAlerta('¡Bienvenido/a!', 'success');
        window.location.href = '/';
    }
}

document.getElementById('contrasenia').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
