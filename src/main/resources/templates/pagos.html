<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos — MenuJPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="topbar">
    <div class="topbar-logo"><div class="topbar-logo-mark">MJ</div>MenuJPA</div>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menú"><i class="bi bi-list"></i></button>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<nav class="nav-sidebar">
    <a href="/" class="nav-logo">
        <div class="nav-logo-mark">MJ</div>
        <div class="nav-logo-text">MenuJPA <span>Gestión gastronómica</span></div>
    </a>
    <div class="nav-section">
        <span class="nav-section-label">Gestión</span>
        <a href="/menus"        class="nav-link"><i class="bi bi-list-ul"></i><span>Menús</span></a>
        <a href="/recetas"      class="nav-link"><i class="bi bi-card-list"></i><span>Recetas</span></a>
        <a href="/alimentos"    class="nav-link"><i class="bi bi-basket"></i><span>Alimentos</span></a>
        <a href="/ingredientes" class="nav-link" data-rol="GERENTE"><i class="bi bi-egg-fried"></i><span>Ingredientes</span></a>
        <a href="/despensas"    class="nav-link" data-rol="GERENTE"><i class="bi bi-box-seam"></i><span>Despensas</span></a>
    </div>
    <div class="nav-section">
        <span class="nav-section-label">Personal</span>
        <a href="/chefs"    class="nav-link" data-rol="GERENTE"><i class="bi bi-person-badge"></i><span>Chefs</span></a>
        <a href="/meseros"  class="nav-link" data-rol="GERENTE"><i class="bi bi-person-vcard"></i><span>Meseros</span></a>
        <a href="/gerentes" class="nav-link" data-rol="GERENTE"><i class="bi bi-person-workspace"></i><span>Gerentes</span></a>
        <a href="/pagos"    class="nav-link active" data-rol="GERENTE"><i class="bi bi-cash-coin"></i><span>Pagos</span></a>
    </div>
    <div class="nav-section">
        <span class="nav-section-label">Operaciones</span>
        <a href="/clientes" class="nav-link" data-rol="GERENTE"><i class="bi bi-people"></i><span>Clientes</span></a>
        <a href="/mesas"    class="nav-link" data-rol="GERENTE,MESERO"><i class="bi bi-grid-3x3-gap"></i><span>Mesas</span></a>
        <a href="/pedidos"  class="nav-link" data-rol="GERENTE,MESERO"><i class="bi bi-receipt"></i><span>Pedidos</span></a>
        <a href="/reservas" class="nav-link" data-rol="GERENTE,MESERO,CLIENTE"><i class="bi bi-calendar-check"></i><span>Reservas</span></a>
    </div>
    <div class="nav-cuenta" id="navCuenta"></div>
</nav>

<main class="page-content">
    <header class="page-header">
        <div>
            <h1 class="page-title">Pagos</h1>
            <p class="page-subtitle">Nómina generada para Chefs y Meseros (monto = salario)</p>
        </div>
        <button class="btn btn-primary" data-rol="GERENTE" onclick="abrirModalGenerar()"><i class="bi bi-plus"></i> Generar Pago</button>
    </header>

    <div class="table-wrapper">
        <div class="table-header"><span class="table-title">Pagos generados</span></div>
        <div class="table-responsive">
            <table class="data-table">
                <thead><tr><th>#</th><th>Empleado</th><th>Rol</th><th>Monto</th><th>Fecha</th></tr></thead>
                <tbody id="bodyPagos">
                    <tr><td colspan="5" style="padding:0"><div class="empty-state"><div class="spinner"></div></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- Modal Generar Pago -->
<div class="modal-overlay" id="modalPagoOverlay">
    <div class="modal modal-md">
        <div class="modal-header">
            <h3 class="modal-title">Generar Pago</h3>
            <button class="modal-close" onclick="modalHide('modalPagoOverlay')"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Rol <span class="required">*</span></label>
                <select class="form-input" id="pagoRol" onchange="cargarEmpleadosParaPago()">
                    <option value="">Seleccionar…</option>
                    <option value="CHEF">Chef</option>
                    <option value="MESERO">Mesero</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Empleado <span class="required">*</span></label>
                <select class="form-input" id="pagoEmpleado"><option value="">Elegí un rol primero</option></select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="modalHide('modalPagoOverlay')">Cancelar</button>
            <button class="btn btn-primary" onclick="generarPago()"><i class="bi bi-check-lg"></i> Generar</button>
        </div>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script>
const API = '/api/v1/pagos';

async function cargarPagos() {
    const data = await cargarConEstado(() => apiFetch(API), 'bodyPagos', 5, 'bi-cash-coin', 'No hay pagos generados');
    if (!data || data.length === 0) return;

    document.getElementById('bodyPagos').innerHTML = data.map(p => `
        <tr>
            <td><span class="badge badge-default">${p.id}</span></td>
            <td>${escapeHtml(p.empleadoNombre)}</td>
            <td><span class="badge badge-accent">${escapeHtml(p.empleadoRol)}</span></td>
            <td>$ ${Number(p.monto || 0).toLocaleString('es-AR')}</td>
            <td>${formatFecha(p.fechaPago)}</td>
        </tr>
    `).join('');
}

function abrirModalGenerar() {
    document.getElementById('pagoRol').value = '';
    document.getElementById('pagoEmpleado').innerHTML = '<option value="">Elegí un rol primero</option>';
    modalShow('modalPagoOverlay');
}

async function cargarEmpleadosParaPago() {
    const rol = document.getElementById('pagoRol').value;
    const sel = document.getElementById('pagoEmpleado');
    if (!rol) { sel.innerHTML = '<option value="">Elegí un rol primero</option>'; return; }

    const url = rol === 'CHEF' ? '/api/v1/chefs' : '/api/v1/meseros';
    const empleados = await apiFetch(url) || [];
    sel.innerHTML = empleados.length
        ? empleados.map(e => `<option value="${e.id}">${escapeHtml(e.apellido)}, ${escapeHtml(e.nombre)}${e.salario != null ? ' — $ ' + Number(e.salario).toLocaleString('es-AR') : ' (sin salario)'}</option>`).join('')
        : '<option value="">No hay empleados con ese rol</option>';
}

async function generarPago() {
    const rol = document.getElementById('pagoRol').value;
    const empleadoId = document.getElementById('pagoEmpleado').value;
    if (!Validar.requerido(rol, 'Rol')) return;
    if (!Validar.requerido(empleadoId, 'Empleado')) return;

    const result = await apiFetch(`${API}/generar`, 'POST', { empleadoId: parseInt(empleadoId), rol });
    if (result) {
        modalHide('modalPagoOverlay');
        mostrarAlerta('Pago generado.', 'success');
        cargarPagos();
    }
}

cargarPagos();
</script>
</body>
</html>
