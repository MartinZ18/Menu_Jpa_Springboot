# ========================
# Base de Datos - MySQL
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/menujpa?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Red de seguridad contra N+1: las colecciones LAZY que se carguen una por una (get por id, /paged)
# se resuelven en lotes de 50 con IN (...) en vez de una query por fila.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ========================
# Thymeleaf
# ========================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ========================
# Server
# ========================
server.port=8080
spring.application.name=menujpa-spring

# ========================
# JWT
# ========================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
